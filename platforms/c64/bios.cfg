# PRG dla C64: [adres ładowania][stub BASIC][kod startowy][obraz BIOS], tablica skoków pod $F800, reszta BIOS pod $E800 (w RAM, ROM-y wyłączone)
MEMORY {
  LOADADDR: start=$07FF, size=2,      type=ro, file=%O;
  PRG:      start=$0801, size=$2000,  type=ro, file=%O;
  JT:       start=$F800, size=$0100,  type=rw, file="";
  BIOSRAM:  start=$E800, size=$1000,  type=rw, file="";
}
SEGMENTS {
  LOADADDR: load=LOADADDR, type=ro;
  STUB:     load=PRG, type=ro;
  BOOT:     load=PRG, type=ro;
  JUMPTAB:  load=PRG, run=JT, type=ro, define=yes;
  BIOS:     load=PRG, run=BIOSRAM, type=ro, define=yes;
}
