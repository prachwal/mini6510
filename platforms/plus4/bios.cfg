# Plus/4 cartridge CART-1, część niska ($8000): [nagłówek autostartu][boot][obraz BIOS] (4 KB), potem dysk (post_build.py)
# Tablica skoków -> $F800, reszta BIOS -> $E800 (RAM)
MEMORY {
  CART:    start=$8000, size=$1000, type=ro, file=%O, fill=yes, fillval=$FF;
  JT:      start=$F800, size=$0100, type=rw, file="";
  BIOSRAM: start=$E800, size=$1000, type=rw, file="";
}
SEGMENTS {
  CARTHDR: load=CART, type=ro;
  BOOT:    load=CART, type=ro;
  JUMPTAB: load=CART, run=JT, type=ro, define=yes;
  BIOS:    load=CART, run=BIOSRAM, type=ro, define=yes;
}
