MEMORY {
  ROM:  start=$F800, size=$0800, type=ro, file=%O, fill=yes, fillval=$FF;
  RAM2: start=$0200, size=$0100, type=rw, file="";
}
SEGMENTS {
  JUMPTAB: load=ROM, type=ro;
  BIOS:    load=ROM, type=ro;
  RELOC:   load=ROM, run=RAM2, type=ro, define=yes;
  VECTORS: load=ROM, type=ro, start=$FFFA;
}
